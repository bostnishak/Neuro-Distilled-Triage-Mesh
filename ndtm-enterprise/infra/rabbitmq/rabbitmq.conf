# ==============================================================================
# Neuro-Distilled Triage Mesh (NDTM) — RabbitMQ Production Configuration
# ==============================================================================

# Network listeners
listeners.tcp.default = 5672
management.tcp.port = 15672

# Default credentials and virtual host
default_user = ndtm_user
default_pass = ndtm_secret_amqp_pass_2026!
default_vhost = /

# Pre-load topology definitions on startup
management.load_definitions = /etc/rabbitmq/definitions.json

# Memory and disk safety watermarks
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Connection and channel limits
max_message_size = 33554432
channel_max = 2047
heartbeat = 60

# Logging
log.console = true
log.console.level = info
