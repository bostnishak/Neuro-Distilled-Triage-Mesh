# ==============================================================================
# Neuro-Distilled Triage Mesh (NDTM) — Prometheus Monitoring Configuration
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "ndtm-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "production"
          service: "ndtm-core-api"

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          environment: "production"
          service: "ndtm-event-mesh"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
