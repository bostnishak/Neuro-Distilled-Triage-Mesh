[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndtm-enterprise-backend"
version = "2.0.0"
description = "Neuro-Distilled Triage Mesh Enterprise Core Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "geoalchemy2>=0.14.0",
    "redis>=5.0.0",
    "aio-pika>=9.4.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "z3-solver>=4.13.0",
    "onnxruntime>=1.18.0",
    "torch>=2.2.0",
    "prometheus-client>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
