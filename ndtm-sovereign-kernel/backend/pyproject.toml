[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndtm-backend"
version = "2.0.0"
description = "Neuro-Distilled Triage Mesh (NDTM) Sovereign Kernel"
authors = [{ name = "NDTM Core Architecture Guild", email = "kernel@ndtm.sovereign" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.4",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "aio-pika>=9.4.2",
    "z3-solver>=4.13.0.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "cryptography>=42.0.8",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "prometheus-client>=0.20.0"
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
