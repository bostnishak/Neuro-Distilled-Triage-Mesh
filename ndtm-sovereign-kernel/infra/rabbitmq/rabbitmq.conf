# ==============================================================================
# NDTM-9000 SOVEREIGN KERNEL — RABBITMQ 3.13 PRODUCTION CONFIGURATION
# High-Throughput AMQP Topology with Publisher Confirms & Memory Watermarks
# ==============================================================================

# Networking & Listeners
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Default Credentials & VHost Setup
default_user = ndtm_admin
default_pass = MeshRabbitSecret2026!
default_vhost = ndtm_vhost
default_user_tags.administrator = true

# Deterministic AMQP Topology Loading
management.load_definitions = /etc/rabbitmq/definitions.json

# Memory & Resource Watermarks
# Set memory alarm watermark to 75% of available RAM
vm_memory_high_watermark.relative = 0.75
vm_memory_high_watermark_paging_ratio = 0.50

# Disk Free Limit (Minimum 2GB available before throttling ingress)
disk_free_limit.absolute = 2GB

# Reliability, Heartbeats & Concurrency
heartbeat = 60
frame_max = 131072
channel_max = 2047
consumer_timeout = 900000

# Channel & Message Acknowledgement Buffers
collect_statistics_interval = 5000
log.console = true
log.console.level = info
