# ==============================================================================
# NDTM-9000 SOVEREIGN KERNEL — REDIS 7.2 PRODUCTION CONFIGURATION
# High-Performance KV Caching, GCRA Leaky-Bucket Rate Limiter & Idempotency Locks
# ==============================================================================

# Network & Connectivity
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (512MB LRU Cap)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 7

# Persistence: AOF & RDB Dual Engine
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance & Latency Monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 20

# Advanced Tuning
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
activerehashing yes
