;; ============================================================================
;; NDTM-9000 SOVEREIGN KERNEL — HIGH-THROUGHPUT PGBOUNCER CONFIGURATION
;; Mode: Transaction Pooling (Anti-Starvation, Sub-Millisecond Multiplexing)
;; ============================================================================

[databases]
;; Primary Read-Write Database (Connecting to PostgreSQL Primary on port 5432)
ndtm_sovereign = host=postgres port=5432 dbname=ndtm_sovereign auth_user=ndtm_admin pool_size=60 min_pool_size=15 reserve_pool=15

;; Dedicated Read-Only Routing Pool for Analytical Replicas & Telemetry
ndtm_sovereign_ro = host=postgres port=5432 dbname=ndtm_sovereign auth_user=ndtm_admin pool_size=40 min_pool_size=10 reserve_pool=10

;; Wildcard fallback for administrative maintenance
* = host=postgres port=5432 auth_user=ndtm_admin

[pgbouncer]
;; Network Listening Configuration
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

;; Authentication & Access Security
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = ndtm_admin, postgres
stats_users = ndtm_admin, prometheus, monitoring

;; High-Throughput Pooling Strategy
;; Transaction pooling mode releases backend connections immediately after COMMIT/ROLLBACK
pool_mode = transaction
server_reset_query = DISCARD ALL
server_reset_query_always = 0

;; Connection Limits & Multiplexing Capacity
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 3.0
max_db_connections = 120
max_user_connections = 120

;; Timeouts and Lifecycle Management
server_round_robin = 1
server_idle_timeout = 120.0
server_connect_timeout = 5.0
server_login_retry = 1.0
server_lifetime = 3600.0
client_idle_timeout = 0.0
client_login_timeout = 15.0
query_timeout = 30.0
query_wait_timeout = 10.0
cancel_wait_timeout = 5.0
idle_transaction_timeout = 60.0

;; TCP & Keepalive Hardening
tcp_defer_accept = 1
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10

;; Observability & Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0

;; Client Startup Compatibility
ignore_startup_parameters = extra_float_digits, search_path, application_name, timezone
