apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ndtm-sovereign-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/sovereign-mesh/ndtm-kernel.git"
    targetRevision: HEAD
    path: deploy/helm/ndtm-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ndtm-mesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
