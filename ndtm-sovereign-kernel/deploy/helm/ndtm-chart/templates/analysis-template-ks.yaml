apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-ks-statistical-analysis
spec:
  args:
    - name: prometheus-url
      value: "http://prometheus-server.monitoring.svc.cluster.local:9090"
    - name: service-name
      value: "{{ .Release.Name }}-backend-canary"
  metrics:
    - name: canary-error-rate
      interval: 30s
      count: 5
      failureLimit: 1
      provider:
        prometheus:
          address: "{{`{{args.prometheus-url}}`}}"
          query: |
            sum(rate(http_requests_total{service="{{`{{args.service-name}}`}}",status=~"5.*"}[2m]))
            /
            sum(rate(http_requests_total{service="{{`{{args.service-name}}`}}"}[2m]))
      successCondition: result[0] <= 0.01
      failureCondition: result[0] > 0.05
    - name: canary-p99-latency
      interval: 30s
      count: 5
      failureLimit: 1
      provider:
        prometheus:
          address: "{{`{{args.prometheus-url}}`}}"
          query: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="{{`{{args.service-name}}`}}"}[2m])) by (le))
      successCondition: result[0] <= 0.500
