syntax = "proto3";

package ndtm.edge.ipc;

option csharp_namespace = "NDTM.Edge.IPC";
option go_package = "ndtm/edge/ipc";
option java_package = "com.ndtm.edge.ipc";

// Real-Time C++ Edge Node to Python Sovereign Kernel Telemetry Bridge
service EdgeTelemetryBridgeService {
  // Bi-directional or client-streaming acoustic telemetry stream
  rpc StreamAcousticTelemetry(stream AcousticFrame) returns (TelemetryAck);

  // Notifies the Python kernel that a zero-copy tensor slot is ready in POSIX SHM
  rpc SubmitTensorDescriptor(TensorDescriptor) returns (TensorCommitAck);

  // Queries current occupancy and sequence numbers of POSIX SHM arena
  rpc GetArenaStatus(ArenaStatusRequest) returns (ArenaStatusResponse);
}

message AcousticFrame {
  uint64 timestamp_ns = 1;
  string device_id = 2;
  int32 sample_rate_hz = 3;
  int32 channel_count = 4;
  repeated float pcm_samples = 5;
}

message TelemetryAck {
  uint64 frames_received = 1;
  bool is_healthy = 2;
  string status_message = 3;
  uint64 server_time_ns = 4;
}

message TensorDescriptor {
  uint32 slot_id = 1;
  uint32 magic_header = 2;  // Must be 0x4E44544D
  repeated uint32 shape = 3; // e.g. [1, 16, 128]
  float laplacian_variance = 4;
  float spectral_entropy = 5;
  repeated float mel_bands = 6;
  bytes sha256_digest = 7;
  uint64 timestamp_ns = 8;
  string sensor_origin = 9;
}

message TensorCommitAck {
  uint32 slot_id = 1;
  bool accepted = 2;
  int32 status_code = 3;
  string rejection_reason = 4;
}

message ArenaStatusRequest {
  string caller_id = 1;
}

message ArenaStatusResponse {
  string arena_name = 1;
  uint64 arena_size_bytes = 2;
  uint32 total_slots = 3;
  uint32 occupied_slots = 4;
  uint64 write_seq = 5;
  uint64 read_seq = 6;
}
