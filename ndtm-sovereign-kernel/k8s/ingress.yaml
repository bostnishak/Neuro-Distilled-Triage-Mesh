apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ndtm-ingress
  namespace: ndtm-sovereign
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ndtm-backend-service"
spec:
  rules:
    - host: ndtm.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ndtm-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ndtm-frontend-service
                port:
                  number: 80
