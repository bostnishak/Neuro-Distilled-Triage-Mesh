apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndtm-backend
  namespace: ndtm-sovereign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ndtm-backend
  template:
    metadata:
      labels:
        app: ndtm-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ndtm-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ndtm-config
            - secretRef:
                name: ndtm-secrets
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: shm-volume
              mountPath: /dev/shm
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "6Gi"
              cpu: "4000m"
      volumes:
        - name: shm-volume
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ndtm-backend-service
  namespace: ndtm-sovereign
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: ndtm-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ndtm-backend-hpa
  namespace: ndtm-sovereign
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ndtm-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
