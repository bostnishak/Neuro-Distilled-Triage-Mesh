# Secrets are NEVER committed. Create the real Secret out-of-band, e.g.:
#   kubectl -n ndtm-sovereign create secret generic ndtm-secrets \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=RABBITMQ_USER=... --from-literal=RABBITMQ_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ED25519_PRIVATE_KEY_HEX="$(python -c 'from core.security_ed25519_jwt import Ed25519Signer as S; print(S.generate_keypair()[0])')"
# For GitOps use External Secrets Operator / SOPS / Sealed Secrets instead of this template.
apiVersion: v1
kind: Secret
metadata:
  name: ndtm-secrets
  namespace: ndtm-sovereign
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  RABBITMQ_USER: "REPLACE_ME"
  RABBITMQ_PASSWORD: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  ED25519_PRIVATE_KEY_HEX: "REPLACE_ME"
  ED25519_PUBLIC_KEY_HEX: "REPLACE_ME"
