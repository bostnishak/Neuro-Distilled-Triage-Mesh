apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndtm-rabbitmq
  namespace: ndtm-sovereign
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ndtm-rabbitmq
  template:
    metadata:
      labels:
        app: ndtm-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: ndtm-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: ndtm-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ndtm-rabbitmq-service
  namespace: ndtm-sovereign
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: ndtm-rabbitmq
